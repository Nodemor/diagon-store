# Diagon Store — nginx site. Installed by deploy/setup-vps.sh as /etc/nginx/sites-available/diagon-store
# __SERVER_NAME__ and __APP_DIR__ are filled in by the setup script; deploy/enable-https.sh adds HTTPS (certbot).
#
# The built shop is served from frontend/dist. /api, /uploads, /s (share links), /sitemap.xml and
# /robots.txt go to the API on 127.0.0.1:5000, which is never exposed directly.

# chat apps (WhatsApp, Facebook, …) don't run JavaScript: give them the product preview page
map $http_user_agent $diagon_preview_bot {
    default 0;
    ~*(whatsapp|facebookexternalhit|facebot|twitterbot|telegrambot|slackbot|discordbot|linkedinbot|skypeuripreview|viber|pinterest) 1;
}

upstream diagon_api {
    server 127.0.0.1:5000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __SERVER_NAME__;

    root __APP_DIR__/frontend/dist;
    index index.html;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---- API and its public files ------------------------------------------------------------
    location /api/ {
        client_max_body_size 60m;   # up to 10 product photos per upload
        proxy_read_timeout 60s;
        proxy_pass http://diagon_api;
    }
    location /uploads/      { proxy_pass http://diagon_api; }
    location /s/            { proxy_pass http://diagon_api; }   # share links + preview cards
    location = /sitemap.xml { proxy_pass http://diagon_api; }
    location = /robots.txt  { proxy_pass http://diagon_api; }

    # ---- the shop (single-page app) ---------------------------------------------------------------
    # file names in /assets change with every build, so they can be cached for a year
    location /assets/ {
        include snippets/diagon-security-headers.conf;
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # product addresses shared by copy-paste still get a preview in chat apps
    location /product/ {
        include snippets/diagon-security-headers.conf;
        if ($diagon_preview_bot) {
            rewrite ^/product/(.*)$ /s/p/$1 last;
        }
        expires -1;
        try_files $uri /index.html;
    }

    # every other address (including the secret back-office address) is handled by the shop
    location / {
        include snippets/diagon-security-headers.conf;
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # certbot (HTTPS certificates) checks this path; everything else hidden stays hidden
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }

    # never serve hidden files (.git, .env, …) if they ever end up in the web root
    location ~ /\. { deny all; return 404; }
}
